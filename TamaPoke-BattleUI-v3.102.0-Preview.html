<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TamaPoke v3.102.0 Battle UI Preview</title>
<style>
:root{--dark:#161d28;--mid:#25303d;--muted:#93a0b0;--fight:#db5843;--switch:#357fb5;--run:#535f6c;--ink:#fff;--green:#62c875;--water:#4e9ed8;--fire:#ee6b45;--cream:#f2efe1}
*{box-sizing:border-box} body{margin:0;background:#101318;color:#e8edf3;font-family:"Noto Sans KR","NanumGothic",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:28px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:14px}.screen{position:relative;width:466px;height:466px;border-radius:50%;overflow:hidden;background:linear-gradient(#93cde9 0 33%,#85b96b 33% 55%,#372f2b 55% 56%,var(--dark) 56% 100%);box-shadow:0 0 0 10px #050607,0 12px 40px #0008}
.screen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 25%,#fff7 0 2%,transparent 3%),linear-gradient(180deg,transparent 0 52%,#0002 52% 56%,transparent 56%);pointer-events:none}
.tag{position:absolute;top:28px;left:50%;transform:translateX(-50%);min-width:108px;max-width:178px;height:24px;border:1px solid white;border-radius:8px;background:var(--dark);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 12px;white-space:nowrap}.phase{position:absolute;top:55px;left:50%;transform:translateX(-50%);background:#d84a4a;border:1px solid white;border-radius:7px;padding:2px 12px;font-size:11px;font-weight:800}
.hud{position:absolute;width:166px;background:var(--dark);border:2px solid var(--accent);border-radius:10px;color:white;padding:7px 10px 7px 12px}.hud:before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:5px;background:var(--accent);border-radius:3px}.hud.foe{left:74px;top:74px;height:58px;--accent:#ef6a46}.hud.you{left:242px;top:180px;height:62px;--accent:#4e9ed8}.row{display:flex;align-items:center;justify-content:space-between;gap:6px}.name{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team{color:var(--muted);font-size:10px}.hp-row{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:9px;color:var(--muted)}.bar{position:relative;height:16px;flex:1;background:#0c1016;border:1px solid #93a0b0;border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;width:72%;background:var(--green)}.bar>i.low{width:28%;background:#f0a33b}.bar:after{content:"";position:absolute;inset:3px 25% 3px auto;width:1px;background:#161d28;box-shadow:-30px 0 #161d28,30px 0 #161d28}.hpnum{text-align:right;font-size:10px;margin-top:2px}.status{display:inline-block;background:#d84a4a;border-radius:6px;padding:1px 6px;font-size:9px;margin-top:2px}
.platform{position:absolute;width:104px;height:14px;border:1px solid #6d7883;background:#28313a;border-radius:50%}.platform.foe{left:296px;top:122px}.platform.you{left:72px;top:248px}.monster{position:absolute;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #0005)}.monster.foe{left:318px;top:66px;width:66px;height:66px}.monster.you{left:85px;top:177px;width:74px;height:74px}.pix{width:100%;height:100%}
.dock{position:absolute;left:0;right:0;top:254px;bottom:0;background:var(--dark);border-top:2px solid var(--muted)}.grid{position:absolute;left:69px;top:274px;width:328px}.btn{height:44px;border:1px solid white;border-radius:11px;color:white;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:.2px}.fight{background:var(--fight);font-size:18px;position:relative}.fight:before,.fight:after{content:"";position:absolute;left:24px;top:12px;width:24px;height:2px;background:#fff;transform:rotate(45deg);transform-origin:center}.fight:after{transform:rotate(-45deg)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.switch{background:var(--switch)}.run{background:var(--run)}
.moves{display:none;grid-template-columns:1fr 1fr;gap:8px}.move{height:44px;background:var(--mid);border:2px solid var(--type);border-radius:10px;color:#fff;padding:5px 8px 4px 14px;position:relative}.move:before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:5px;border-radius:3px;background:var(--type)}.move b{display:block;font-size:13px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip{display:inline-block;margin-top:3px;border-radius:5px;padding:1px 6px;font-size:9px;background:var(--type);color:#101318;font-weight:800}.message{display:none;height:96px;background:var(--mid);border:1px solid white;border-radius:12px;padding:10px 12px;text-align:center;font-size:13px;line-height:20px}.tap{color:var(--muted);font-size:10px;margin-top:3px}
.controls{display:flex;gap:8px}.controls button{border:0;border-radius:8px;padding:9px 14px;background:#2b3440;color:#fff;font-weight:700;cursor:pointer}.controls button.active{background:#4b76a7}.note{max-width:470px;font-size:13px;line-height:1.55;color:#b8c1cc;text-align:center}
</style></head>
<body>
<div class="wrap">
<div class="screen">
  <div class="tag">야생 · 맑음</div>
  <div class="hud foe"><div class="row"><span class="name">*가브몬 Lv.24</span><span class="team">1/1</span></div><div class="hp-row"><span>HP</span><span class="bar"><i></i></span></div></div>
  <div class="platform foe"></div>
  <div class="monster foe"><svg class="pix" viewBox="0 0 48 48"><g fill="#4e83c8"><rect x="14" y="7" width="20" height="21"/><rect x="10" y="14" width="28" height="13"/><rect x="16" y="28" width="6" height="11"/><rect x="27" y="28" width="6" height="11"/></g><g fill="#e5edf7"><rect x="17" y="12" width="5" height="5"/><rect x="27" y="12" width="5" height="5"/><rect x="20" y="21" width="9" height="4"/></g><g fill="#243040"><rect x="18" y="13" width="2" height="2"/><rect x="29" y="13" width="2" height="2"/></g></svg></div>
  <div class="platform you"></div>
  <div class="monster you"><svg class="pix" viewBox="0 0 48 48"><g fill="#f29b38"><rect x="14" y="8" width="20" height="20"/><rect x="10" y="17" width="28" height="12"/><rect x="12" y="29" width="9" height="11"/><rect x="28" y="29" width="9" height="11"/><rect x="32" y="5" width="5" height="12"/></g><g fill="#fff5d6"><rect x="17" y="13" width="5" height="5"/><rect x="27" y="13" width="5" height="5"/><rect x="20" y="22" width="9" height="4"/></g><g fill="#2a2d33"><rect x="18" y="14" width="2" height="2"/><rect x="29" y="14" width="2" height="2"/></g></svg></div>
  <div class="hud you"><div class="row"><span class="name">아구몬 Lv.23</span><span class="team">1/3</span></div><div class="hp-row"><span>HP</span><span class="bar"><i class="low"></i></span></div><div class="hpnum">43/156</div></div>
  <div class="dock"></div>
  <div class="grid">
    <div id="main"><div class="btn fight">싸운다</div><div class="bottom"><div class="btn switch">교체</div><div class="btn run">도망</div></div></div>
    <div id="moves" class="moves">
      <div class="move" style="--type:#ef6a46"><b>베이비플레임</b><span class="chip">불꽃</span></div>
      <div class="move" style="--type:#c8a35a"><b>메가펀치</b><span class="chip">격투</span></div>
      <div class="move" style="--type:#7ba968"><b>돌진</b><span class="chip">노말</span></div>
      <div class="move" style="--type:#9970c5"><b>워 크라이</b><span class="chip">변화</span></div>
    </div>
    <div id="msg" class="message">아구몬의 베이비플레임!<br>효과가 굉장했다!<div class="tap">터치 &gt;</div></div>
  </div>
</div>
<div class="controls"><button class="active" onclick="show('main',this)">기본 명령</button><button onclick="show('moves',this)">기술 선택</button><button onclick="show('msg',this)">전투 메시지</button></div>
<div class="note">466×466 원형 AMOLED 기준 UI 시안입니다. 실제 펌웨어에서는 현재 포켓몬/디지몬 스프라이트와 배경을 그대로 사용하고 HUD와 버튼만 이 방향으로 바뀝니다.</div>
</div>
<script>function show(id,b){for(const x of ['main','moves','msg'])document.getElementById(x).style.display=x===id?(id==='moves'?'grid':'block'):'none';document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}</script>
</body></html>
